name: Build Plugin

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Znajdź pom.xml
        run: |
          find . -name pom.xml -print

      - name: Zbuduj plugin
        run: |
          POM=$(find . -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "BLAD: Nie znaleziono pom.xml!"
            exit 1
          fi
          echo "Znaleziono: $POM"
          mvn -f "$POM" clean package

      - name: Udostępnij JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerTeleport
          path: "**/target/*.jar"
